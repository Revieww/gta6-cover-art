<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Nights — GTA-style Cover Maker</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls" aria-label="Cover editor">
    <h1>Vice Nights</h1>
    <p class="tagline">Turn your photos into a multi-panel GTA-style poster cover. Everything stays on your machine — nothing is uploaded.</p>

    <fieldset>
      <legend>Photos — one per panel</legend>
      <div class="panelrow">
        <button type="button" data-panel="0" class="active">Panel 1 · Hero</button>
        <button type="button" data-panel="1">Panel 2</button>
        <button type="button" data-panel="2">Panel 3</button>
      </div>
      <label>Panel 1 photo <input type="file" data-photo="0" accept="image/*"></label>
      <label>Panel 2 photo <input type="file" data-photo="1" accept="image/*"></label>
      <label>Panel 3 photo <input type="file" data-photo="2" accept="image/*"></label>
      <label class="check"><input type="checkbox" id="samephoto" checked> Use one photo for all panels</label>
      <div class="samples">
        <span>Try a sample:</span>
        <button type="button" data-sample="pier" data-panel="0">Pier</button>
        <button type="button" data-sample="boulevard" data-panel="1">Boulevard</button>
      </div>
    </fieldset>

    <fieldset>
      <legend>Crop the selected panel</legend>
      <label>Zoom <span id="zoomvalue">100%</span>
        <input type="range" id="zoom" min="1" max="2.5" step="0.05" value="1">
      </label>
      <label>Move left / right
        <input type="range" id="panx" min="-100" max="100" step="1" value="0">
      </label>
      <label>Move up / down
        <input type="range" id="pany" min="-100" max="100" step="1" value="0">
      </label>
    </fieldset>

    <fieldset>
      <legend>Lettering</legend>
      <label>Caption <input id="caption" type="text" maxlength="40" value="Sunset Heist"></label>
      <label>Sub-caption <input id="sub" type="text" maxlength="48" value="Vice City · 2026"></label>
    </fieldset>

    <fieldset>
      <legend>Colour grade</legend>
      <div class="choice">
        <button type="button" data-grade="sunset" class="active">Vice Sunset</button>
        <button type="button" data-grade="neon">Neon Nights</button>
        <button type="button" data-grade="midnight">Midnight Drive</button>
      </div>
    </fieldset>

    <fieldset>
      <legend>Post size</legend>
      <div class="choice">
        <button type="button" data-size="square">Square 1080²</button>
        <button type="button" data-size="portrait">Portrait 1080×1350</button>
        <button type="button" data-size="wide" class="active">Wide 1920×1080</button>
      </div>
      <p class="hint">Preview is <span id="sizelabel">1920 x 1080</span> pixels.</p>
    </fieldset>

    <button id="export" type="button">Export PNG</button>
    <p id="status" role="status"></p>
  </section>
  <section class="preview" aria-label="Cover preview">
    <canvas id="cover" width="1920" height="1080" aria-label="The cover"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
